<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Data Science and AI/ML banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f63"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="14" fill="url(#bg)"/>
  <path d="M0 262 C250 238 520 286 1000 244 L1000 300 L0 300 Z" fill="#22d3ee" opacity="0.18"/>

  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">

    <!-- floating code fragments -->
    <g fill="#e6f7fb" opacity="0.75" font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="40" y="46">&lt;data&gt;</text>
      <text x="400" y="52">df.head()</text>
      <text x="60" y="246">y = f(x)</text>
      <text x="676" y="258">&#8721; x&#178;</text>
    </g>

    <!-- speech-bubble tags -->
    <g font-weight="700" font-size="15" fill="#0b2a35" text-anchor="middle">
      <g>
        <rect x="150" y="28" width="112" height="34" rx="7" fill="#ffa564"/>
        <polygon points="186,62 200,62 192,74" fill="#ffa564"/>
        <text x="206" y="50">PYTHON</text>
      </g>
      <g>
        <rect x="296" y="64" width="62" height="30" rx="7" fill="#ffa564"/>
        <polygon points="316,94 330,94 324,105" fill="#ffa564"/>
        <text x="327" y="84">NLP</text>
      </g>
      <g>
        <rect x="520" y="62" width="70" height="30" rx="7" fill="#ffa564"/>
        <polygon points="540,92 554,92 548,103" fill="#ffa564"/>
        <text x="555" y="82">SHAP</text>
      </g>
      <g>
        <rect x="250" y="208" width="84" height="30" rx="7" fill="#ffa564"/>
        <polygon points="272,208 286,208 276,197" fill="#ffa564"/>
        <text x="292" y="228">Pandas</text>
      </g>
      <g>
        <rect x="346" y="208" width="118" height="30" rx="7" fill="#ffa564"/>
        <polygon points="368,208 382,208 372,197" fill="#ffa564"/>
        <text x="405" y="228">TensorFlow</text>
      </g>
      <g>
        <rect x="476" y="208" width="100" height="30" rx="7" fill="#ffa564"/>
        <polygon points="498,208 512,208 502,197" fill="#ffa564"/>
        <text x="526" y="228">Power BI</text>
      </g>
      <g>
        <rect x="588" y="208" width="60" height="30" rx="7" fill="#ffa564"/>
        <polygon points="610,208 624,208 614,197" fill="#ffa564"/>
        <text x="618" y="228">SQL</text>
      </g>
    </g>

    <!-- title -->
    <text x="40" y="166" font-size="52" font-weight="300" fill="#e6f7fb" textLength="640" lengthAdjust="spacingAndGlyphs">DATA SCIENCE &amp; AI/ML</text>

    <!-- monitor -->
    <rect x="745" y="78" width="215" height="140" rx="10" fill="#e8eef0"/>
    <rect x="755" y="88" width="195" height="108" rx="4" fill="#12262e"/>

    <!-- chart on screen -->
    <g stroke="#e6f7fb" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <line x1="770" y1="102" x2="770" y2="182"/>
      <line x1="770" y1="182" x2="938" y2="182"/>
    </g>
    <g fill="#22d3ee">
      <rect x="782" y="156" width="14" height="26" rx="2"/>
      <rect x="804" y="142" width="14" height="40" rx="2"/>
      <rect x="826" y="150" width="14" height="32" rx="2"/>
      <rect x="848" y="128" width="14" height="54" rx="2"/>
      <rect x="870" y="136" width="14" height="46" rx="2"/>
      <rect x="892" y="112" width="14" height="70" rx="2"/>
    </g>
    <polyline points="789,146 811,130 833,138 855,114 877,122 899,102 925,96" fill="none" stroke="#ffa564" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffa564">
      <circle cx="811" cy="130" r="3.5"/>
      <circle cx="855" cy="114" r="3.5"/>
      <circle cx="899" cy="102" r="3.5"/>
    </g>

    <circle cx="852" cy="207" r="4" fill="#12262e"/>
    <rect x="828" y="218" width="48" height="14" fill="#cfd9dd"/>
    <rect x="800" y="232" width="104" height="8" rx="4" fill="#e8eef0"/>

    <!-- AI/ML bubble over the monitor -->
    <g>
      <rect x="812" y="26" width="132" height="46" rx="9" fill="#ffa564"/>
      <polygon points="838,72 856,72 842,88" fill="#ffa564"/>
      <text x="878" y="58" font-size="26" font-weight="800" fill="#0b2a35" text-anchor="middle">AI / ML</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
