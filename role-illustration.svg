<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-label="AI/ML engineer working on a laptop" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f63"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="360" rx="20" fill="url(#bg)"/>

  <!-- soft teal blob -->
  <path d="M70 250 C40 170 90 95 160 82 C215 72 250 40 305 70 C360 100 372 190 330 250 C300 295 150 318 70 250 Z" fill="#22d3ee" opacity="0.30"/>

  <g stroke="#0b2a35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- floor line -->
    <line x1="24" y1="326" x2="376" y2="326" stroke="#e6f7fb" stroke-opacity="0.7"/>

    <!-- hoodie / torso -->
    <path d="M128 326 C126 262 152 214 200 210 C248 214 274 262 272 326 Z" fill="#0891b2"/>
    <path d="M178 212 C184 232 216 232 222 212" fill="none"/>

    <!-- neck -->
    <rect x="188" y="186" width="24" height="26" rx="8" fill="#f2bf94"/>

    <!-- hair back / bun -->
    <circle cx="200" cy="92" r="17" fill="#1b3a4b"/>

    <!-- ears -->
    <circle cx="157" cy="150" r="8" fill="#f2bf94"/>
    <circle cx="243" cy="150" r="8" fill="#f2bf94"/>

    <!-- head -->
    <circle cx="200" cy="148" r="44" fill="#f7c9a0"/>

    <!-- hair front -->
    <path d="M156 146 C152 98 248 98 244 146 C234 126 216 118 200 118 C184 118 166 126 156 146 Z" fill="#1b3a4b"/>

    <!-- glasses -->
    <rect x="169" y="145" width="26" height="20" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="205" y="145" width="26" height="20" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <line x1="195" y1="153" x2="205" y2="153"/>
    <line x1="169" y1="152" x2="158" y2="150"/>
    <line x1="231" y1="152" x2="242" y2="150"/>

    <!-- eyes + smile -->
    <circle cx="182" cy="155" r="2.6" fill="#0b2a35" stroke="none"/>
    <circle cx="218" cy="155" r="2.6" fill="#0b2a35" stroke="none"/>
    <path d="M188 177 Q200 187 212 177" fill="none"/>

    <!-- laptop lid facing us -->
    <rect x="138" y="228" width="124" height="82" rx="9" fill="#eef4f6"/>
    <rect x="126" y="310" width="148" height="12" rx="6" fill="#d3dfe3"/>

    <!-- sleeves / hands -->
    <circle cx="140" cy="300" r="9" fill="#f2bf94"/>
    <circle cx="260" cy="300" r="9" fill="#f2bf94"/>

    <!-- laptop stickers: bar chart, neural net, Py -->
    <g stroke-width="2.5">
      <!-- bar chart -->
      <rect x="152" y="268" width="8" height="18" fill="#22d3ee"/>
      <rect x="163" y="258" width="8" height="28" fill="#0891b2"/>
      <rect x="174" y="263" width="8" height="23" fill="#ffa564"/>
      <line x1="149" y1="287" x2="186" y2="287"/>
      <!-- neural net -->
      <line x1="202" y1="262" x2="222" y2="256"/>
      <line x1="202" y1="262" x2="222" y2="276"/>
      <line x1="202" y1="282" x2="222" y2="256"/>
      <line x1="202" y1="282" x2="222" y2="276"/>
      <circle cx="202" cy="262" r="5" fill="#22d3ee"/>
      <circle cx="202" cy="282" r="5" fill="#22d3ee"/>
      <circle cx="222" cy="256" r="5" fill="#ffa564"/>
      <circle cx="222" cy="276" r="5" fill="#ffa564"/>
      <circle cx="240" cy="266" r="5" fill="#0891b2"/>
      <line x1="227" y1="256" x2="235" y2="264"/>
      <line x1="227" y1="276" x2="235" y2="268"/>
    </g>
    <text x="200" y="304" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#0b2a35" stroke="none" text-anchor="middle">Python</text>

    <!-- small tablet with line chart (left) -->
    <rect x="34" y="262" width="76" height="56" rx="9" fill="#eef4f6"/>
    <polyline points="46,300 60,286 72,293 86,274 98,280" fill="none" stroke="#0891b2" stroke-width="3.5"/>
    <circle cx="86" cy="274" r="3.5" fill="#ffa564" stroke-width="2"/>

    <!-- data sheet (right) -->
    <g transform="rotate(-8 322 296)">
      <rect x="292" y="274" width="62" height="46" rx="5" fill="#eef4f6"/>
      <line x1="302" y1="287" x2="344" y2="287" stroke="#0891b2" stroke-width="2.5"/>
      <line x1="302" y1="298" x2="336" y2="298" stroke="#0891b2" stroke-width="2.5"/>
      <line x1="302" y1="309" x2="340" y2="309" stroke="#0891b2" stroke-width="2.5"/>
    </g>
  </g>

  <!-- floating symbols -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#e6f7fb">
    <text x="82" y="82" font-size="28">{ }</text>
    <text x="52" y="168" font-size="22" fill="#67e8f9">#</text>
    <text x="300" y="118" font-size="22">&lt;/&gt;</text>
    <text x="336" y="188" font-size="22" fill="#67e8f9">&#8249;</text>
    <text x="120" y="208" font-size="18" fill="#67e8f9">&#963;</text>
  </g>

  <!-- role tag -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <rect x="262" y="30" width="86" height="30" rx="8" fill="#ffa564" stroke="#0b2a35" stroke-width="3"/>
    <polygon points="284,60 298,60 288,72" fill="#ffa564" stroke="#0b2a35" stroke-width="3" stroke-linejoin="round"/>
    <rect x="283" y="58" width="16" height="5" fill="#ffa564"/>
    <text x="305" y="51" font-size="15" font-weight="800" fill="#0b2a35" text-anchor="middle">AI / ML</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
